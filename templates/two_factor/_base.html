<!doctype html>
<html lang="en">
<head>
    <style>
        body {
            background: #f5f5f5;
            padding: 64px 16px;
        }

        .account-card {
            max-width: 520px;
            margin: 0 auto;
            padding: 32px;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
        }

        .account-card .container {
            max-width: 100%;
            padding: 0;
        }

        .account-card .row {
            margin: 0;
        }

        .account-card .col-md-5 {
            flex: 0 0 100%;
            max-width: 100%;
            margin-left: 0;
            padding: 0;
        }

        @media (max-width: 576px) {
            body {
                padding-top: 32px;
            }

            .account-card {
                padding: 24px;
            }
        }
    </style>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kaan Gallery — Account{% endblock %}</title>

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.2/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block extra_media %}{% endblock %}
</head>
<body>
    <main class="account-card">
        {% block content_wrapper %}
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        {% endblock %}
    </main>
</body>
</html>
