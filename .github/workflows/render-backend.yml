name: Test and deploy Render backend

on:
  push:
    branches:
      - deploy/render-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a commit already on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Check migrations and run backend tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

      - name: Build the production Docker image
        run: docker build --tag kaan-gallery-backend:${{ github.sha }} .

      - name: Trigger Render for this tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo 'Missing repository secret RENDER_DEPLOY_HOOK_URL' >&2
            exit 1
          fi
          case "$RENDER_DEPLOY_HOOK_URL" in
            https://api.render.com/deploy/srv-dbpphf56e07s73b316k0\?key=*) ;;
            *) echo 'Render deploy hook does not match the backend service' >&2; exit 1 ;;
          esac
          response_file=$(mktemp)
          status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}")
          if [ "$status" != 200 ] && [ "$status" != 202 ]; then
            echo "Render rejected the deploy (HTTP $status)" >&2
            exit 1
          fi
          echo "Render accepted deployment of $COMMIT_SHA (HTTP $status)."
          echo 'Follow the build and health check in the Render dashboard; this job confirms acceptance, not a live release.'
